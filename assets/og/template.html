<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Archivo:ital,wght@0,300;0,400;1,300&family=Libre+Baskerville:ital@1&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1200px; height:630px; overflow:hidden;
    background:#0f1624; color:#f0ece4;
    font-family:'Archivo',sans-serif; font-weight:300;
    position:relative;
    display:flex; flex-direction:column; justify-content:space-between;
    padding:64px 72px 56px;
  }
  /* faint oversized index number, editorial-style */
  .num {
    position:absolute; right:36px; top:-60px;
    font-family:'Bebas Neue',sans-serif;
    font-size:420px; line-height:1;
    color:rgba(240,236,228,.045);
    letter-spacing:-8px;
    user-select:none;
  }
  .rule { width:64px; height:2px; background:#c8a97e; margin-bottom:22px; }
  .kicker {
    font-size:20px; letter-spacing:5px; text-transform:uppercase;
    color:rgba(240,236,228,.55);
    display:flex; align-items:center; gap:18px;
  }
  .kicker::before { content:""; width:46px; height:1px; background:#c8a97e; }
  .title {
    font-family:'Bebas Neue',sans-serif;
    font-size:120px; line-height:.96; letter-spacing:1px;
    max-width:980px;
    text-wrap:balance;
  }
  .title em {
    font-family:'Libre Baskerville',serif; font-style:italic;
    font-size:.62em; color:#c8a97e; letter-spacing:0;
    vertical-align:middle;
  }
  .sub {
    margin-top:26px; font-size:27px; line-height:1.45;
    color:rgba(240,236,228,.55); max-width:760px;
  }
  .foot {
    display:flex; justify-content:space-between; align-items:flex-end;
    border-top:1px solid rgba(240,236,228,.12); padding-top:26px;
    font-size:21px; letter-spacing:3px; text-transform:uppercase;
    color:rgba(240,236,228,.45);
  }
  .foot .site { color:#c8a97e; }
</style>
</head>
<body>
  <div class="num" id="num"></div>
  <div>
    <div class="kicker" id="kicker">AI Engineer · RAG · Spring AI · MCP</div>
  </div>
  <div>
    <div class="rule"></div>
    <div class="title" id="title">ABDELKERIM DASSI</div>
    <div class="sub" id="sub">I build AI that actually goes live: RAG, agents, Spring AI / MCP. Tunis → Gulf → World.</div>
  </div>
  <div class="foot">
    <span>Abdelkerim Dassi</span>
    <span class="site">abdelkerimdassi.com</span>
  </div>
</body>
</html>
